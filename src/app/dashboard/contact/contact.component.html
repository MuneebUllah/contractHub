<table class="table caption-top table-bordered table-striped" *ngIf="false">
    <thead>
      <tr>
        <th scope="col">Contact</th>
        <th scope="col">Email</th>
        <th scope="col">entity Type</th>
        <th scope="col">Action</th>

      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let items of contact">
        <td scope="row">{{items.name}}</td>
        <td>{{items.email}}</td>
        <td>{{items.entityType}}</td>
        <td><img src="{{items.action}}" alt="img"/></td>
      </tr>
    </tbody>
  </table>

<!-- <div class="w-100"> -->
  <div class="d-flex flex-column justify-content-center align-items-center w-100">
    <div class="bg-white rounded d-flex flex-column justify-content-center align-items-center p-3 gap-4" style=" width:70% ;">
      <div class="w-100">
        <img src="../../../assets/cross.svg" class="float-end position-relative" style="top: -50px; right: -30px;"/>
      </div>
      <div class="d-flex gap-3 w-100 justify-content-center">
        <button  type="button" class="btn btn-primary">Individual Contact</button>
        <button class="border-primary btn text-primary bg-white ">Company Contact</button>
      </div>
      <form class="row d-flex flex-wrap gap-2 p-5">
        <div class="col-5">
          <label>First Name</label>
          <input type="text" placeholder="First Name">
        </div>
          <div class="col-5">
          <label>Last Name</label>
          <input type="text" placeholder="Last Name"/>
        </div>
          <div class="col-5">
          <label>Phone</label>
          <input type="number" placeholder="Phone"/>
        </div>
        <span class="text-center">---------------------optional--------------------------</span>
        <!-- <div class="d-flex flex-wrap gap-3 justify-content-center"> -->
          <div class="col-10">
            <label>Street Address</label>
            <input type="text" placeholder="Street Address">
          </div >
            <div class="col-5">
            <label>City</label>
            <input type="text" placeholder="City"/>
          </div>
            <div class="col-5">
            <label>State</label>
            <input type="text" placeholder="State"/>
          </div>
            <div class="col-5">
            <label>Zip</label>
            <input type="text" placeholder="Zip"/>
          </div>
            <div class="draggable-container col-5">
            <label>State</label>
            <input type="text" placeholder="State" cdkDrag/>
          </div>
          <div class="example-box" cdkDrag>
            Drag me around
          </div>
       
          <!-- </div> -->
      </form>
    </div>
  <!-- </div> -->
</div>
