 <div class="bg-white d-flex justify-content-between" style="border-bottom: 1px solid #d9e0e5;">
  <div class="d-flex gap-2 align-items-center">

    <div class="d-flex align-items-center gap-2 ms-5">
      <img src="../../../assets/Back Button.svg" alt="img" style="height: 40px; width: 40px;" (click)="routingService.goBack()"/>
      <h1>{{ veriableService.getActiveVariableName() }}</h1>
    </div>
  </div>
    <div>
      <!-- <div>
        <button class="px-4 py-2 border-0 text-white">Save</button>
      </div> -->
      <div class="d-flex gap-3 m-2" *ngIf="veriableService.addContactFormButton" >
        <button class="px-3 py-2 border-0 text-white" (click)="addContactForm()" [disabled]="isResponceReceived">Add Contact</button>
      </div>
      <div class="d-flex gap-3 m-2" *ngIf="veriableService.viewDoc">
        <button class="fs-4 border-0 text-white" style="width: 90px;" (click)="sandContractForm()">Send</button>
      </div>
      <div class="d-flex gap-3" style="margin: .2rem 1rem;" *ngIf="veriableService.notificationIcon">
        <div class="notification"></div>
        <div class="p-3 rounded-circle" style="background-color: rgba(238, 238, 238, 1); cursor: pointer;" (click)="notification()">
          <img src="../../../assets/ic_bell.svg" alt="img" />
      </div>
          <img src="../../../assets/setting.svg" alt="img" (click)="goToSetting()" style="cursor:pointer;"/>
      </div>
    </div>
  </div>

  <!-- <hr> -->
