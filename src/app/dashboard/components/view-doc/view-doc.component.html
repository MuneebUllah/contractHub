<div class="d-flex w-100">
    <div class="d-flex flex-column gap-2" style="width: 250px;">
        <input type="text" placeholder="Signature" class="col-12" cdkDrag>
        <input type="text" placeholder="Initals" class="col-12" cdkDrag/>
        <input #draggableInput type="text"  cdkDrag>
        <input type="text" placeholder="Signer Name" class="col-12" cdkDrag (change)="location($event)" id="textbox"/>
        <input type="text" placeholder="Signer Title" class="col-12" cdkDrag/>
        <input type="text" placeholder="Signer Date" class="col-12" cdkDrag/>
        <input type="text" placeholder="Street Address" class="col-12" >
        <input type="text" placeholder="Text Field" class="col-12" />
        <input type="text" placeholder="CheckBox" class="col-12" />
        <input type="text" placeholder="Email" class="col-12" />
        <input type="text" placeholder="Phone" class="col-12" />
        <input type="text" placeholder="Street Address" class="col-12" >
        <input type="text" placeholder="City" class="col-12" />
        <input type="text" placeholder="State" class="col-12" />
        <input type="text" placeholder="Zip" class="col-12" />

</div>
<div class="w-100" style="height: 80vh; overflow: hidden;" >
    <ngx-doc-viewer [url]="'http://localhost:9090/Document-1704962939633-113499466.pdf'" viewer="url" style="width:130%;height:115%; position: relative; top: -80px; left: -350px;">
    </ngx-doc-viewer>
    <!-- <ngx-extended-pdf-viewer [src]="'src/assets/CamScanner 02-07-2023 14.52.pdf'"  [showPresentationModeButton]="true"></ngx-extended-pdf-viewer> -->
<div class="bg-white d-flex flex-column justify-content-around popup p-5" *ngIf="veriableService.showEmailForm">
      <table class="table caption-top table-bordered table-striped h-auto">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col">Action</th>
    
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let items of allContacts" >
            <td scope="row" >{{items.name }}</td>
            <td>{{items.email }}</td>
<td class="form-check form-switch"><input class="form-check-input" style="float: none; width: 3rem;" type="checkbox" id="flexSwitchCheckChecked" (click)="receivemail(items._id)"></td>
          </tr>
        </tbody>
      </table>
      <button type="button" class="btn btn-primary" (click)="sandContract()">Send</button>
      
    </div>
  </div>
</div>
